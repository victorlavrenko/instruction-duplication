name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.12.13"}
          - {os: ubuntu-latest, python: "3.14"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12.13'
        run: coverage run -m pytest && coverage report
      - if: matrix.os != 'ubuntu-latest' || matrix.python != '3.12.13'
        run: pytest

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e .
      - run: python tests/coding_quality/quality_gate.py
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pyright --version
      - run: python -m pyright
      - run: python -m mypy
      - run: pytest tests/coding_quality

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
      - run: python -m pip install "build==1.5.0"
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: instruction-duplication --version
      - run: >-
          instruction-duplication reproduce 1 --fake
          --input-jsonl examples/questions-smoke.jsonl
          --datasets medqa medxpertqa afrimedqa --models ministral-3-14b-2512
          --workspace package-smoke --permutations 100 --bootstraps 100

  tmp-iclr-inspect:
    if: github.head_ref == 'tmp-iclr27-export'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Inspect frozen archive
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh rejudged-3.0.13.tgz
          echo '--- archive listing ---'
          tar -tzf rejudged-3.0.13.tgz | head -250 || true
          rm -rf /tmp/frozen && mkdir -p /tmp/frozen
          tar -xzf rejudged-3.0.13.tgz -C /tmp/frozen
          echo '--- manifests ---'
          find /tmp/frozen -type f -name manifest.json -print
          echo '--- dirs ---'
          find /tmp/frozen -maxdepth 4 -type d | sort | head -250
          echo '--- files of interest ---'
          find /tmp/frozen -type f \( -iname '*human*' -o -iname '*ae*' -o -iname '*analysis*' -o -iname '*judgment*' -o -iname '*response*' \) -printf '%p %s\n' | sort | head -400
