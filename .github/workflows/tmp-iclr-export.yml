name: tmp-iclr-export
on:
  push:
    branches: [tmp-iclr27-export]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Build and verify anonymous ICLR artifact
        run: python tools/tmp_build_iclr.py
      - name: Upload final anonymous artifact
        uses: actions/upload-artifact@v4
        with:
          name: ICLR2027_Anonymous_Reproduction_Materials
          path: |
            /tmp/out/ICLR2027_Anonymous_Reproduction_Materials.zip
            /tmp/out/ZIP_SHA256.txt
          retention-days: 30
